<div class="contenedor-admin">
  <header class="cabecera">
    <h2>Panel de Administración</h2>
    <p>Gestión global de usuarios y asignación de roles del sistema.</p>
  </header>

  <p *ngIf="cargando()">Cargando usuarios...</p>
  <p *ngIf="errorMensaje()" class="error-auth">{{ errorMensaje() }}</p>

  <div class="tabla-responsive" *ngIf="!cargando() && !errorMensaje()">
    <table class="tabla-usuarios">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Correo Electrónico</th>
          <th>Rol Actual</th>
          <th>Cambiar Rol</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of usuarios()">
          <td>{{ user.nombre }}</td>
          <td>{{ user.correo }}</td>
          <td>
            <span class="badge" [ngClass]="user.rol.toLowerCase()">
              {{ user.rol }}
            </span>
          </td>
          <td>
            <select #selectRol (change)="cambiarRol(user.id_usuario, selectRol.value)" [value]="user.rol">
              <option value="Cliente">Cliente</option>
              <option value="Coordinador">Coordinador</option>
              <option value="Administración">Administración</option>
            </select>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
