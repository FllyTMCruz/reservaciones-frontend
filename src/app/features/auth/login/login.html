<div class="auth-page">
  <div class="auth-ambient-glow"></div>
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-logo-wrap">
        <span class="material-symbols-outlined logo-icon">calendar_month</span>
        <span class="brand-title">ReservApp</span>
      </div>
      <span class="brand-tag">Gestión de Espacios & Eventos</span>
    </div>

    <div class="auth-header">
      <h2>Iniciar Sesión</h2>
      <p>Ingresa tus credenciales para acceder a la plataforma de reservaciones.</p>
    </div>

    <div *ngIf="errorMensaje()" class="alert-box alert-error">
      <span class="material-symbols-outlined">error</span>
      <span>{{ errorMensaje() }}</span>
    </div>

    <form (ngSubmit)="iniciarSesion()" class="auth-form">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <div class="input-icon-wrap">
          <span class="material-symbols-outlined input-icon">mail</span>
          <input type="email" id="email" name="email" [(ngModel)]="credenciales.email"
                 placeholder="ejemplo@correo.com" required class="form-control with-icon" />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-icon-wrap">
          <span class="material-symbols-outlined input-icon">lock</span>
          <input type="password" id="password" name="password" [(ngModel)]="credenciales.password"
                 placeholder="••••••••" required class="form-control with-icon" />
        </div>
      </div>

      <button type="submit" class="btn-auth-submit" [disabled]="cargando()">
        <span class="material-symbols-outlined" *ngIf="!cargando()">login</span>
        <span>{{ cargando() ? 'Iniciando sesión...' : 'Entrar a ReservApp' }}</span>
      </button>
    </form>

    <div class="auth-footer">
      <span>¿No tienes una cuenta aún?</span>
      <a routerLink="/registro" class="auth-link">Regístrate aquí</a>
    </div>
  </div>
</div>
