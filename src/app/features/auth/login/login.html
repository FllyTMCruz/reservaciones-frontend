<div class="auth-contenedor">
  <div class="tarjeta-auth">
    <h2>Iniciar Sesión</h2>
    <p>Ingresa tus datos para acceder al sistema de reservaciones.</p>
    
    <!-- (ngSubmit) ejecuta nuestra función cuando presionan el botón o dan Enter -->
    <form (ngSubmit)="iniciarSesion()">
      <div class="grupo-input">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" name="email" [(ngModel)]="credenciales.email" required>
      </div>
      
      <div class="grupo-input">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" [(ngModel)]="credenciales.password" required>
      </div>
      
      <button type="submit" class="btn-bloque">Entrar</button>
    </form>
    
    <div class="pie-auth">
      ¿No tienes una cuenta? <a routerLink="/registro">Regístrate aquí</a>
    </div>
  </div>
</div>
