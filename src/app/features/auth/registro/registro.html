<div class="auth-contenedor">
  <div class="tarjeta-auth">
    <h2>Crear Cuenta</h2>
    <p>Regístrate para comenzar a gestionar tus espacios.</p>
    
    <form (ngSubmit)="registrarUsuario()">
      
      <!-- Nuevo campo para el Nombre -->
      <div class="grupo-input">
        <label for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" name="nombre" [(ngModel)]="credenciales.nombre" required>
      </div>

      <div class="grupo-input">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" name="email" [(ngModel)]="credenciales.email" required>
      </div>
      
      <div class="grupo-input">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" [(ngModel)]="credenciales.password" required>
      </div>
      
      <button type="submit" class="btn-bloque btn-registro" [disabled]="cargando">
        {{ cargando ? 'Registrando...' : 'Registrarme' }}
      </button>
    </form>
    <p *ngIf="errorMensaje" class="error-auth">{{ errorMensaje }}</p>
    <div class="pie-auth">
      ¿Ya tienes una cuenta? <a routerLink="/login">Inicia sesión aquí</a>
    </div>
  </div>
</div>
