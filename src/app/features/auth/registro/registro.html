<div class="auth-page">
  <div class="auth-ambient-glow"></div>
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-logo-wrap">
        <span class="material-symbols-outlined logo-icon">calendar_month</span>
        <span class="brand-title">ReservApp</span>
      </div>
      <span class="brand-tag">Gestión de Espacios & Eventos</span>
    </div>

    <div class="auth-header">
      <h2>Crear Cuenta</h2>
      <p>Regístrate para reservar espacios y dar seguimiento a tus eventos.</p>
    </div>

    <div *ngIf="errorMensaje()" class="alert-box alert-error">
      <span class="material-symbols-outlined">error</span>
      <span>{{ errorMensaje() }}</span>
    </div>

    <form (ngSubmit)="registrarUsuario()" class="auth-form">
      <div class="form-group">
        <label for="nombre">Nombre Completo</label>
        <div class="input-icon-wrap">
          <span class="material-symbols-outlined input-icon">badge</span>
          <input type="text" id="nombre" name="nombre" [(ngModel)]="credenciales.nombre"
                 placeholder="Ej. Juan Pérez" required class="form-control with-icon" />
        </div>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <div class="input-icon-wrap">
          <span class="material-symbols-outlined input-icon">mail</span>
          <input type="email" id="email" name="email" [(ngModel)]="credenciales.email"
                 placeholder="ejemplo@correo.com" required class="form-control with-icon" />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-icon-wrap">
          <span class="material-symbols-outlined input-icon">lock</span>
          <input type="password" id="password" name="password" [(ngModel)]="credenciales.password"
                 placeholder="Mínimo 6 caracteres" required class="form-control with-icon" />
        </div>
      </div>

      <button type="submit" class="btn-auth-submit" [disabled]="cargando()">
        <span class="material-symbols-outlined" *ngIf="!cargando()">person_add</span>
        <span>{{ cargando() ? 'Creando cuenta...' : 'Crear Cuenta en ReservApp' }}</span>
      </button>
    </form>

    <div class="auth-footer">
      <span>¿Ya tienes una cuenta?</span>
      <a routerLink="/login" class="auth-link">Inicia sesión aquí</a>
    </div>
  </div>
</div>
